name: legado
description: "Legado - 开源阅读 - Free novel reader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.3.0
  crypto: ^3.0.6
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  xml: ^6.5.0
  html: ^0.15.5
  archive: ^4.0.3
  collection: ^1.19.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default/
